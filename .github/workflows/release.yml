name: Release

# タグを打つとビルドして Release にバイナリを添付する。
#   git tag v0.1.0 && git push origin v0.1.0
# 手動実行（workflow_dispatch）ではビルドと成果物の保存だけ行い、Release は作らない。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    # 外部のアクションはタグではなくコミットで固定する（タグは付け替えられるため）。
    # 版を上げるときは、コメントの版とコミットを一緒に更新する。
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ターゲットは net48 だが、ビルドには .NET SDK を使う（参照アセンブリは NuGet から入る）。
      # SDK はサポート期間の長い LTS 版にしておく。
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Build
        shell: pwsh
        run: |
          dotnet build src/CtxTray/CtxTray.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          if (-not (Test-Path src/CtxTray/bin/Release/ctxtray.exe)) {
            throw "ctxtray.exe was not produced"
          }

      # 判定ロジックの試験（tests/CtxTray.Tests）。失敗があれば終了コード 1 で止まる。
      - name: Tests
        shell: pwsh
        run: |
          dotnet build tests/CtxTray.Tests/CtxTray.Tests.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw "test build failed" }
          & tests/CtxTray.Tests/bin/Release/ctxtray-tests.exe
          if ($LASTEXITCODE -ne 0) { throw "tests failed" }

      # 出来上がった exe が壊れていないことだけ確かめる。
      # 実行環境に Claude Desktop は無いので、データが取れないのは正常。
      # ここで見たいのは「起動して JSON を吐いて終了する」こと。
      - name: Smoke test
        shell: pwsh
        run: |
          $exe = "src/CtxTray/bin/Release/ctxtray.exe"
          $out = & $exe --json | Out-String
          if ([string]::IsNullOrWhiteSpace($out)) { throw "no output from --json" }
          $json = $out | ConvertFrom-Json
          if ($null -eq $json.generated_at) { throw "unexpected JSON shape" }
          Write-Host "diag: $($json.diag)"

      # タグ名やブランチ名は式で直接スクリプトに埋め込まず、環境変数で渡す
      # （名前に記号が含まれていてもスクリプトとして解釈されないように）。
      - name: Package
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:REF_NAME -replace '[^0-9A-Za-z._-]', '-'
          $zip = "ctxtray-$version-win-x64.zip"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src/CtxTray/bin/Release/ctxtray.exe dist/
          Copy-Item README.md, README.ja.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          "$hash  $zip" | Out-File -FilePath "$zip.sha256" -Encoding ascii

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ctxtray
          path: |
            ctxtray-*.zip
            ctxtray-*.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            ctxtray-*.zip
            ctxtray-*.sha256
          body: |
            Windows 10 1903+ / Windows 11. No runtime install required.
            Extract the zip and move `ctxtray.exe` to a folder you will keep before
            turning on "Start at sign-in".

            The binary is not code-signed, so SmartScreen will warn on first run
            (More info -> Run anyway). Verify the SHA256 against the `.sha256` file,
            or build from source.
